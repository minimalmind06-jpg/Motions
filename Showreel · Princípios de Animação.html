<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showreel · Princípios de Animação</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--lt:#e5e6e9;--gr:#222327;--b:#3b6bff;--r:#ff3b3b;box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0d0f;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;cursor:pointer;
  font-family:'Anton',Impact,'Arial Narrow',sans-serif;transform-origin:center}
.sc{position:absolute;inset:0;visibility:hidden}
.lt{background:var(--lt);color:var(--gr)}.dk{background:var(--gr);color:#f1f1f3}
.ar,.full{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.note{position:absolute;font-family:'Caveat',cursive;font-weight:700;font-size:80px;line-height:1;white-space:nowrap}
.ball{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--b);transform-origin:50% 100%;left:0;top:0}
.ghost{background:var(--b)}
#ph{position:absolute;left:0;right:0;top:400px;text-align:center;font-size:175px;line-height:1;text-transform:uppercase;white-space:nowrap}
.ch,.l{display:inline-block}
#dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--b);margin-left:.05em}
.w{position:absolute;left:0;right:0;top:370px;text-align:center;font-size:340px;line-height:1;visibility:hidden;text-transform:uppercase}
.sl{position:absolute;right:0;height:10px;background:var(--r);border-radius:5px}
text{font-family:'Anton',Impact,sans-serif}
#role{position:absolute;left:0;right:0;top:290px;text-align:center;font-size:120px;line-height:1;color:var(--r)}
#role i{font-style:normal;color:#f1f1f3;margin-left:.2em}
#nm{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:270px;line-height:1.1;text-transform:uppercase}
#fd{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--b);margin-left:.04em}
#bar{position:absolute;left:0;bottom:0;height:8px;width:1920px;background:var(--b);transform-origin:0 50%;z-index:9}
</style>
</head>
<body>
<div id="stage">
  <div class="sc lt" id="sA"><div id="ph"></div><div id="dotref"></div></div>
  <div class="sc dk" id="sB"></div>
  <div class="sc lt" id="sC">
    <svg class="full" viewBox="0 0 1920 1080" fill="none" stroke-linecap="round">
      <g transform="translate(190 250)">
        <path id="ax" d="M0 0V700H700" stroke="#222327" stroke-width="8"/>
        <path id="cl" d="M0 700L700 0" stroke="#ff3b3b" stroke-width="14"/>
        <path id="ce" d="M0 700C455 700 245 0 700 0" stroke="#3b6bff" stroke-width="14"/>
        <text id="x1" x="350" y="790" fill="#222327" stroke="none" font-size="40" text-anchor="middle">TEMPO</text>
        <text id="x2" transform="translate(-50 350) rotate(-90)" fill="#222327" stroke="none" font-size="40" text-anchor="middle">PROGRESSO</text>
      </g>
      <text id="lb1" x="1000" y="250" fill="#ff3b3b" stroke="none" font-size="80">LINEAR</text>
      <text id="lb2" x="1000" y="560" fill="#3b6bff" stroke="none" font-size="80">EASE IN-OUT</text>
      <rect x="1000" y="331" width="760" height="8" fill="#b9bcc3"/><rect x="1000" y="641" width="760" height="8" fill="#b9bcc3"/>
      <rect id="bx1" x="1000" y="290" width="90" height="90" rx="12" fill="#ff3b3b" stroke="none"/>
      <rect id="bx2" x="1000" y="600" width="90" height="90" rx="12" fill="#3b6bff" stroke="none"/>
    </svg>
  </div>
  <div class="sc dk" id="sD" style="background-image:radial-gradient(circle,#4a4d55 5px,transparent 6px);background-size:110px 110px;background-position:25px 45px"></div>
  <div class="sc lt" id="sE">
    <svg class="full" viewBox="0 0 1920 1080" fill="none">
      <g id="dg"><g transform="translate(960 540)">
        <circle r="250" stroke="#c6c8ce" stroke-width="40"/>
        <circle id="pr" r="250" stroke="#3b6bff" stroke-width="40" stroke-linecap="round" transform="rotate(-90)"/>
        <circle id="pulse" r="250" stroke="#ff3b3b" stroke-width="10" opacity="0"/>
      </g></g>
      <text id="pct" x="960" y="640" text-anchor="middle" font-size="240" fill="#222327">0%</text>
    </svg>
  </div>
  <div class="sc dk" id="sF">
    <div id="role"></div><div id="nm"></div>
    <div class="note" id="rep" style="right:50px;bottom:30px;font-size:40px;color:#8a8e99"></div>
  </div>
</div>

<script>
/* ===== EDITA AQUI ===== */
const CFG={
  phrase:"Movimento é emoção",
  words:["Rápido","Pesado","Leve","Elástico"], // animações: 1 rápido · 2 pesado · 3 leve · 4 elástico
  role:"Motion Designer", name:"O teu nome", cta:"vamos falar?"
};
/* ======================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'),NS='http://www.w3.org/2000/svg',BL='#3b6bff',RD='#ff3b3b';
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}
addEventListener('resize',fit);fit();
$$('.sc').forEach(sc=>{const s=document.createElementNS(NS,'svg');s.setAttribute('class','ar');s.setAttribute('viewBox','0 0 1920 1080');sc.appendChild(s)});
const letters=t=>[...t].map(c=>c===' '?'<span class="ch">&nbsp;</span>':`<span class="ch l">${c}</span>`).join('');

function build(){
const tl=gsap.timeline({paused:true});
const S={A:0,B:3.4,C:7,D:9.2,E:11.2,F:13};
const cut=id=>{tl.set('.sc',{autoAlpha:0},S[id]).set('#s'+id,{autoAlpha:1},S[id])};
['A','B','C','D','E','F'].forEach(cut);
gsap.set('#sA',{autoAlpha:1});

/* helpers: notas manuscritas + setas */
function note(id,txt,x,y,rot,col){const d=document.createElement('div');d.className='note';d.textContent=txt;
  d.style.cssText=`left:${x}px;top:${y}px;color:${col}`;$('#s'+id).appendChild(d);gsap.set(d,{rotation:rot,autoAlpha:0});return d}
function arrow(id,x1,y1,cx,cy,x2,y2,col){
  const svg=$('#s'+id+' .ar'),mk=d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);
    p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width',7);
    p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');svg.appendChild(p);return p};
  const a=Math.atan2(y2-cy,x2-cx),h=(o)=>`${x2-36*Math.cos(a+o)} ${y2-36*Math.sin(a+o)}`;
  const sh=mk(`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`),hd=mk(`M${h(-.5)}L${x2} ${y2}L${h(.5)}`);
  const L=sh.getTotalLength();gsap.set(sh,{strokeDasharray:L,strokeDashoffset:L});gsap.set(hd,{autoAlpha:0});return [sh,hd]}
function reveal(t,n,a){tl.fromTo(n,{autoAlpha:0,y:24},{autoAlpha:1,y:0,duration:.35,ease:'back.out(2)'},t)
  .to(a[0],{strokeDashoffset:0,duration:.45,ease:'power2.inOut'},t+.12).to(a[1],{autoAlpha:1,duration:.05},t+.5)}

/* ===== A · bola → ponto final ===== */
$('#ph').innerHTML=letters(CFG.phrase)+'<span id="dot"></span>';
gsap.set('.ch',{opacity:0});gsap.set('#dot',{opacity:0});
const ball=document.createElement('div');ball.className='ball';
const ghosts=[...Array(7)].map(()=>{const g=document.createElement('div');g.className='ball ghost';$('#sA').appendChild(g);return g});
$('#sA').appendChild(ball);
const st=stage.getBoundingClientRect(),k=st.width/1920,dr=$('#dot').getBoundingClientRect();
const dx=(dr.left+dr.width/2-st.left)/k,dB=(dr.bottom-st.top)/k,dS=dr.width/k;
gsap.set([ball,...ghosts],{top:dB-120});
const Lx=[dx-960,dx-560,dx-250,dx];
gsap.set(ball,{x:Lx[0]-60,y:-(dB+220),scaleX:.85,scaleY:1.25});
const land=t=>tl.to(ball,{scaleX:1.45,scaleY:.55,duration:.06,ease:'power1.out'},t).to(ball,{scaleX:.85,scaleY:1.2,duration:.08},t+.06);
const hop=(t,x,h,d)=>tl.to(ball,{y:-h,duration:d/2,ease:'power2.out'},t).to(ball,{y:0,duration:d/2,ease:'power2.in'},t+d/2)
  .to(ball,{x:x-60,duration:d,ease:'none'},t).to(ball,{scaleX:1,scaleY:1,duration:d/2-.06},t+.06)
  .to(ball,{scaleX:.85,scaleY:1.2,duration:d/2},t+d/2);
tl.to(ball,{y:0,duration:.55,ease:'power2.in'},0);land(.55);
hop(.61,Lx[1],380,.5);land(1.11);hop(1.17,Lx[2],250,.42);land(1.59);hop(1.65,Lx[3],150,.34);land(1.99);
tl.fromTo('#ph .ch',{opacity:0,y:90},{opacity:1,y:0,duration:.4,ease:'back.out(2)',stagger:.035},1.95)
  .to(ball,{scaleX:dS/120,scaleY:dS/120,duration:.18,ease:'power2.in'},2.06)
  .set(ball,{autoAlpha:0},2.24).set('#dot',{opacity:1},2.24)
  .fromTo('#dot',{scale:1.6},{scale:1,duration:.3,ease:'back.out(3)'},2.24);
const hist=[];
gsap.ticker.add(()=>{const o=gsap.getProperty(ball,'opacity');
  hist.unshift([gsap.getProperty(ball,'x'),gsap.getProperty(ball,'y'),gsap.getProperty(ball,'scaleX'),gsap.getProperty(ball,'scaleY')]);
  if(hist.length>30)hist.pop();
  ghosts.forEach((g,i)=>{const h=hist[(i+1)*2]||hist[hist.length-1];gsap.set(g,{x:h[0],y:h[1],scaleX:h[2],scaleY:h[3],opacity:o*(.3-i*.04)})})});
const nA=note('A','squash & stretch',170,130,-5,RD),aA=arrow('A',420,235,520,330,Lx[0]+130,dB-300,RD);
reveal(.45,nA,aA);

/* ===== B · palavras com o seu significado ===== */
const W=CFG.words.map(w=>{const d=document.createElement('div');d.className='w';d.innerHTML=[...w].map(c=>`<span class="l">${c}</span>`).join('');$('#sB').appendChild(d);return d});
const LS=W.map(w=>w.querySelectorAll('.l'));
W[0].style.color=BL;W[1].style.color=RD;W[2].style.color='#d4d7dd';
LS[3].forEach((l,i)=>l.style.color=i%2?RD:BL);
const sl=[250,420,620,790].map(y=>{const d=document.createElement('div');d.className='sl';d.style.cssText=`top:${y}px;width:${700+y%300}px;opacity:0`;$('#sB').appendChild(d);return d});
let t=S.B;
tl.set(W[0],{autoAlpha:1},t).fromTo(W[0],{x:-2300,skewX:-40,scaleX:1.6},{x:0,skewX:0,scaleX:1,duration:.38,ease:'expo.out'},t)
  .fromTo(sl,{autoAlpha:1,scaleX:0,transformOrigin:'100% 50%'},{scaleX:1,duration:.2,stagger:.03,ease:'power2.out'},t)
  .to(sl,{autoAlpha:0,duration:.15},t+.4)
  .to(W[0],{x:2300,skewX:-40,scaleX:1.6,duration:.18,ease:'expo.in'},t+.7);
t=S.B+.9;
tl.set(W[1],{autoAlpha:1,transformOrigin:'50% 100%'},t).fromTo(W[1],{y:-1300},{y:0,duration:.3,ease:'power4.in'},t)
  .to(W[1],{scaleY:.78,scaleX:1.12,duration:.06},t+.3).to(W[1],{scaleY:1,scaleX:1,duration:.3,ease:'elastic.out(1,.4)'},t+.36)
  .to('#sB',{keyframes:{y:[0,22,-14,9,-4,0],ease:'none'},duration:.35},t+.3)
  .to(W[1],{y:1300,duration:.18,ease:'power3.in'},t+.72);
t=S.B+1.8;
tl.set(W[2],{autoAlpha:1},t).fromTo(LS[2],{y:140,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'sine.out',stagger:.06},t)
  .to(W[2],{y:-50,duration:.85,ease:'sine.inOut'},t)
  .to(LS[2],{y:-260,autoAlpha:0,duration:.25,ease:'sine.in',stagger:.04},t+.62);
t=S.B+2.7;
tl.set(W[3],{autoAlpha:1},t).fromTo(W[3],{scaleX:3.2,scaleY:.45},{scaleX:1,scaleY:1,duration:.85,ease:'elastic.out(1,.35)'},t);
const nB=note('B','a palavra é o movimento',1180,50,4,'#cfd3db'),aB=arrow('B',1380,150,1330,230,1230,330,'#cfd3db');
reveal(S.B+.15,nB,aB);

/* ===== C · easing ===== */
tl.set('#sC',{autoAlpha:1},S.C);
const dash=id=>{const p=$(id),L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});return p};
const ax=dash('#ax'),cl=dash('#cl'),ce=dash('#ce');
gsap.set(['#lb1','#lb2','#x1','#x2'],{opacity:0});
tl.to(ax,{strokeDashoffset:0,duration:.3,ease:'power2.out'},S.C)
  .to(cl,{strokeDashoffset:0,duration:.5,ease:'power2.inOut'},S.C+.1)
  .to(ce,{strokeDashoffset:0,duration:.5,ease:'power2.inOut'},S.C+.35)
  .to(['#lb1','#lb2','#x1','#x2'],{opacity:1,duration:.2,stagger:.08},S.C+.3)
  .to('#bx1',{x:670,duration:1,ease:'none'},S.C+.85)
  .to('#bx2',{x:670,duration:1,ease:'power2.inOut'},S.C+.85);
const nC=note('C','slow in, slow out',1030,800,-4,BL),aC=arrow('C',1450,860,1620,840,1580,712,BL);
reveal(S.C+1.1,nC,aC);

/* ===== D · cobra de pontos (follow-through) ===== */
const pts=[...Array(17)].map((_,i)=>[80+i*110,100+(4+Math.round(3*Math.sin(i*.6)))*110]);
const pos=s=>{s=Math.max(0,Math.min(16,s));const i=Math.floor(s),f=s-i,a=pts[i],b=pts[Math.min(i+1,16)];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]};
const N=11;
for(let i=0;i<N;i++){const sz=76-i*5,d=document.createElement('div');
  d.style.cssText=`position:absolute;left:0;top:0;width:${sz}px;height:${sz}px;border-radius:50%;background:${i?BL:RD};opacity:${1-i*.06}`;
  $('#sD').appendChild(d);gsap.set(d,{xPercent:-50,yPercent:-50,x:pts[0][0],y:pts[0][1],zIndex:N-i});
  const o={s:0};
  tl.to(o,{s:16-i,duration:1.4,ease:'power3.out',onUpdate(){const p=pos(o.s);gsap.set(d,{x:p[0],y:p[1]})}},S.D+.1+i*.045)}
const nD=note('D','follow-through',1330,880,-4,'#cfd3db'),aD=arrow('D',1500,880,1400,820,1300,740,'#cfd3db');
reveal(S.D+.9,nD,aD);

/* ===== E · dial (anticipation) ===== */
const C=2*Math.PI*250,pr=$('#pr'),pc=$('#pct');
gsap.set(pr,{strokeDasharray:C,strokeDashoffset:C});gsap.set('#dg',{svgOrigin:'960 540'});
const P={v:0};
tl.to('#dg',{scale:.86,rotation:-35,duration:.5,ease:'power2.inOut'},S.E)
  .to('#dg',{scale:1,rotation:360,duration:.9,ease:'back.out(1.6)'},S.E+.55)
  .to(P,{v:100,duration:.85,ease:'expo.out',onUpdate(){pr.style.strokeDashoffset=C*(1-P.v/100);pc.textContent=Math.round(P.v)+'%'}},S.E+.55)
  .fromTo('#pulse',{opacity:1,scale:1,svgOrigin:'0 0'},{opacity:0,scale:1.35,duration:.4,ease:'power2.out'},S.E+1.1)
  .fromTo('#pct',{scale:1.15,svgOrigin:'960 540'},{scale:1,duration:.3,ease:'back.out(3)'},S.E+1.1);
const nE=note('E','anticipation',200,260,-6,RD),aE=arrow('E',420,360,560,470,700,470,RD);
reveal(S.E+.1,nE,aE);

/* ===== F · cargo / nome + CTA ===== */
$('#role').innerHTML=[...CFG.role.toUpperCase()].map(c=>c===' '?'<span class="ch">&nbsp;</span>':`<span class="ch l">${c}</span>`).join('')+'<i>/</i>';
$('#nm').innerHTML=[...CFG.name.toUpperCase()].map(c=>c===' '?'<span class="ch">&nbsp;</span>':`<span class="ch l">${c}</span>`).join('')+'<span id="fd"></span>';
tl.fromTo('#role .l,#role i',{y:90,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,ease:'expo.out',stagger:.02},S.F+.05)
  .fromTo('#nm .l',{y:140,autoAlpha:0},{y:0,autoAlpha:1,duration:.45,ease:'expo.out',stagger:.035},S.F+.25)
  .fromTo('#fd',{y:-520,scaleY:1.3,scaleX:.8},{y:0,scaleX:1,scaleY:1,duration:.6,ease:'bounce.out'},S.F+.7);
const nF=note('F',CFG.cta,1130,760,-5,'#6c93ff'),aF=arrow('F',1250,750,1350,690,1470,690,'#6c93ff');
const hit=$('#sF');gsap.set(nF,{fontSize:104});
reveal(S.F+1.1,nF,aF);
tl.fromTo('#rep',{autoAlpha:0},{autoAlpha:1,duration:.4},S.F+1.6);
gsap.set('#rep',{autoAlpha:0});

tl.fromTo('#bar',{scaleX:0},{scaleX:1,duration:15,ease:'none'},0);
stage.addEventListener('click',()=>tl.restart());
tl.play();
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(build);
</script>
</body>
</html>
