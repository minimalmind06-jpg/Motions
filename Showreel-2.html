<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showreel · Princípios de animação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;overflow:hidden;transform-origin:50% 50%;background:#d9d9d9}
.bg,#content{position:absolute;left:0;top:0;width:1920px;height:1080px}
#content>*{position:absolute}
.big{font-family:'Anton','Bebas Neue','Haettenschweiler','Impact','Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;line-height:1;white-space:nowrap;letter-spacing:.004em}
.c{display:inline-block}
.bl{display:inline-block;width:0;height:0}
.note{font-family:'Caveat','Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive;font-weight:700;line-height:1;white-space:nowrap;font-size:78px}
.w{left:0;top:0;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;font-size:380px}
.ball{left:0;top:0;width:110px;height:110px;border-radius:50%;background:#000;transform-origin:50% 100%}
.floor{left:120px;width:1680px;height:8px;background:#000;transform-origin:0 50%}
.sline{position:absolute;left:0;height:8px;background:#000}
.bub{position:absolute;border:4px solid #fff;border-radius:50%}
.lab{font-size:92px;color:#000}
</style>
</head>
<body>
<div id="stage">
  <div id="bgA" class="bg"></div>
  <div id="bgB" class="bg"></div>
  <div id="content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ============ EDITA AQUI ============
   fx: rapido | pesado | elastico | leve  (a animação de cada palavra) */
const CFG = {
  frase: "O movimento tem peso",
  palavras: [
    { t: "Rápido",  fx: "rapido",   nota: "timing" },
    { t: "Pesado",  fx: "pesado",   nota: "peso e impacto" },
    { t: "Elástico",fx: "elastico", nota: "overshoot" },
    { t: "Leve",    fx: "leve",     nota: "ease out" }
  ],
  cargo: "Motion Designer",
  nome:  "Ana Silva",
  cta:   "vamos animar algo juntos?"
};
/* ==================================== */

const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage'),
      content = document.getElementById('content'),
      bgA = document.getElementById('bgA'),
      bgB = document.getElementById('bgB');

function fit(){ stage.style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`; }
function mk(tag, cls, parent, txt){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  (parent || content).appendChild(e);
  return e;
}
function chars(parent, txt){ return [...txt].map(ch => mk('span','c',parent, ch === ' ' ? '\u00A0' : ch)); }
function pos(e){
  const r = e.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width/1920;
  return { l:(r.left-s.left)/k, t:(r.top-s.top)/k, r:(r.right-s.left)/k, b:(r.bottom-s.top)/k, w:r.width/k, h:r.height/k };
}
function sv(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function build(){
  const LIGHT='#d9d9d9', GRAPH='#2a2a2a';
  const tl = gsap.timeline({ paused:true });
  const gp = (e,p) => gsap.getProperty(e,p);

  /* marcas de tempo */
  const S4=7.6, S5=9.8, S6=11.7, S7=13.3;
  const WT=[4.2,5.05,5.9,6.75], WD=.85, WBG=[LIGHT,GRAPH,LIGHT,GRAPH], WM=['l','u','r','d'];

  gsap.set(bgA,{backgroundColor:LIGHT});
  gsap.set(bgB,{backgroundColor:LIGHT,clipPath:'inset(0 100% 0 0)'});

  function wipe(t,color,mode,o={}){
    const {x=960,y=540,d=.3,ease='power4.inOut',r0=0} = o;
    const from = {l:'inset(0 100% 0 0)',r:'inset(0 0 0 100%)',u:'inset(0 0 100% 0)',d:'inset(100% 0 0 0)',c:`circle(${r0}px at ${x}px ${y}px)`}[mode];
    const to = mode==='c' ? `circle(2400px at ${x}px ${y}px)` : 'inset(0 0 0 0)';
    tl.set(bgB,{backgroundColor:color},t);
    tl.fromTo(bgB,{clipPath:from},{clipPath:to,duration:d,ease,immediateRender:false},t);
    tl.set(bgA,{backgroundColor:color},t+d);
  }

  /* camadas base: canvas (cobra) + svg (setas, gráfico, dial) */
  const cv = mk('canvas','',content); cv.width=1920; cv.height=1080; cv.style.cssText='left:0;top:0';
  gsap.set(cv,{autoAlpha:0});
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 1920 1080'); svg.setAttribute('width',1920); svg.setAttribute('height',1080);
  svg.style.cssText='left:0;top:0;pointer-events:none'; content.appendChild(svg);

  /* anotações manuscritas com seta */
  function note(txt,x,y,rot,col,a,fs=78){
    const d = mk('div','note',content,txt);
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.color=col; d.style.fontSize=fs+'px';
    gsap.set(d,{rotation:rot,transformOrigin:'0 50%',autoAlpha:0});
    let grp=null, shaft=null, head=null;
    if(a){
      const dx=a.ex-a.sx, dy=a.ey-a.sy, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L, b=a.b||0;
      const c1=[a.sx+dx/3+nx*b, a.sy+dy/3+ny*b], c2=[a.sx+dx*2/3+nx*b*.6, a.sy+dy*2/3+ny*b*.6];
      const ang=Math.atan2(a.ey-c2[1], a.ex-c2[0]), hl=40;
      const p1=[a.ex-hl*Math.cos(ang-.5), a.ey-hl*Math.sin(ang-.5)], p2=[a.ex-hl*Math.cos(ang+.5), a.ey-hl*Math.sin(ang+.5)];
      grp = sv('g',{},svg);
      const st={fill:'none',stroke:col,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1'};
      shaft = sv('path',Object.assign({d:`M${a.sx} ${a.sy} C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${a.ex} ${a.ey}`},st),grp);
      head  = sv('path',Object.assign({d:`M${p1[0]} ${p1[1]} L${a.ex} ${a.ey} L${p2[0]} ${p2[1]}`},st),grp);
      gsap.set(grp,{autoAlpha:0}); gsap.set([shaft,head],{strokeDashoffset:1});
    }
    return { in(t,out){
      tl.set(d,{autoAlpha:1},t);
      tl.fromTo(d,{clipPath:'inset(-30% 100% -30% -5%)'},{clipPath:'inset(-30% -5% -30% -5%)',duration:.3,ease:'power2.out',immediateRender:false},t);
      if(grp){
        tl.set(grp,{autoAlpha:1},t+.16);
        tl.fromTo(shaft,{strokeDashoffset:1},{strokeDashoffset:0,duration:.28,ease:'power2.inOut',immediateRender:false},t+.16);
        tl.fromTo(head,{strokeDashoffset:1},{strokeDashoffset:0,duration:.1,ease:'none',immediateRender:false},t+.42);
      }
      if(out) tl.to([d,grp].filter(Boolean),{autoAlpha:0,duration:.12},out);
    }};
  }

  /* ================= CENA 1+2 · bola → ponto final ================= */
  const START_X=260, FLOOR=760;

  const phrase = mk('div','big',content);
  phrase.style.cssText += 'left:0;top:0;width:1920px;text-align:center;font-size:190px;color:#fff';
  const row = mk('span','',phrase); row.style.display='inline-block';
  const pc = chars(row, CFG.frase);
  const dotSpan = mk('span','c',row,'.'); dotSpan.style.color='transparent';
  const bl1 = mk('i','bl',row);
  let fs=190; const rw=pos(row).w;
  if(rw>1640){ fs=Math.floor(190*1640/rw); phrase.style.fontSize=fs+'px'; }
  phrase.style.top = (FLOOR - pos(bl1).b) + 'px';
  const dp=pos(dotSpan), PX=dp.l+dp.w/2, DS=fs*.2;
  gsap.set(pc,{autoAlpha:0});

  const floor = mk('div','floor',content); floor.style.top=FLOOR+'px'; gsap.set(floor,{scaleX:0});
  const ghosts = [...Array(9)].map(()=>{ const e=mk('div','ball',content); gsap.set(e,{xPercent:-50,yPercent:-100,autoAlpha:0}); return e; });
  const ball = mk('div','ball',content);
  gsap.set(ball,{xPercent:-50,yPercent:-100,x:START_X,y:-40});

  tl.fromTo(floor,{scaleX:0},{scaleX:1,duration:.35,ease:'expo.out',immediateRender:false},0);
  tl.fromTo(ball,{y:-40,scaleX:.9,scaleY:1.15},{y:FLOOR,scaleX:.8,scaleY:1.3,duration:.42,ease:'power2.in'},0);

  let L=.42;
  const L0=L;
  [{up:.38,down:.36,h:420},{up:.33,down:.31,h:290},{up:.28,down:.27,h:190}].forEach(b=>{
    tl.to(ball,{scaleX:1.5,scaleY:.5,duration:.06,ease:'power1.out'},L);
    tl.to(ball,{scaleX:.82,scaleY:1.28,duration:.08,ease:'power1.out'},L+.06);
    tl.to(ball,{y:FLOOR-b.h,duration:b.up,ease:'power2.out'},L+.05);
    tl.to(ball,{scaleX:1,scaleY:1,duration:b.up-.09,ease:'sine.inOut'},L+.14);
    tl.to(ball,{y:FLOOR,duration:b.down,ease:'power2.in'},L+.05+b.up);
    tl.to(ball,{scaleX:.84,scaleY:1.22,duration:b.down,ease:'power2.in'},L+.05+b.up);
    L += .05+b.up+b.down;
  });
  const L3=L; // aterragem final = ponto final
  tl.to(ball,{x:PX,duration:L3-L0,ease:'none'},L0);
  tl.to(ball,{scaleX:1.5,scaleY:.5,duration:.06,ease:'power1.out'},L3);
  tl.to(ball,{scaleX:DS/110,scaleY:DS/110,backgroundColor:'#fff',duration:.34,ease:'back.out(2.2)'},L3+.06);
  tl.to(floor,{autoAlpha:0,duration:.3},L3+.05);

  wipe(L3+.02,GRAPH,'c',{x:PX,y:FLOOR-DS/2,d:.7,ease:'power2.out'});
  tl.fromTo(pc,{autoAlpha:0,y:150,rotation:()=>gsap.utils.random(-12,12)},
    {autoAlpha:1,y:0,rotation:0,duration:.5,ease:'back.out(1.8)',stagger:{each:.028,from:'end'},immediateRender:false},L3+.1);
  tl.to(pc,{y:-70,autoAlpha:0,duration:.14,ease:'power2.in',stagger:.004},4.02);
  tl.to(ball,{scaleX:0,scaleY:0,duration:.12,ease:'power2.in'},4.1);

  note('squash & stretch',430,210,-4,'#000',{sx:560,sy:300,ex:318,ey:690,b:70}).in(.55,2.3);
  note('a bola vira o ponto final',PX-780,FLOOR+120,-3,'#fff',{sx:PX-150,sy:FLOOR+112,ex:PX-8,ey:FLOOR+26,b:-40}).in(3.3,4.0);

  /* ================= CENA 3 · palavras ================= */
  const words = CFG.palavras.map(p=>{
    const el = mk('div','w big',content);
    const inner = mk('span','',el); inner.style.display='inline-block';
    const cs = chars(inner,p.t);
    const bl = mk('i','bl',inner);
    return {p,el,inner,cs,bl};
  });
  words.forEach((w,i)=>{
    w.el.style.color = i%2 ? '#fff' : '#000';
    const iw=pos(w.inner).w;
    if(iw>1700) w.el.style.fontSize = Math.floor(380*1700/iw)+'px';
    w.wb = pos(w.bl).b;
    gsap.set(w.el,{autoAlpha:0});
  });

  const FX = {
    rapido(w,T,wb){
      tl.set(w.el,{autoAlpha:1},T+.04);
      tl.fromTo(w.inner,{x:-1500,skewX:-35},{x:0,skewX:0,duration:.34,ease:'expo.out',immediateRender:false},T+.04);
      [[wb-330,700],[wb-215,1150],[wb-120,520],[wb-40,900]].forEach(([y,wd],k)=>{
        const l=mk('div','sline',w.el); l.style.top=y+'px'; l.style.width=wd+'px';
        tl.fromTo(l,{x:-wd},{x:1950,duration:.34,ease:'power2.out',immediateRender:false},T+.04+k*.02);
      });
      tl.to(w.inner,{x:1600,skewX:30,duration:.16,ease:'power3.in'},T+.66);
    },
    pesado(w,T,wb){
      gsap.set(w.inner,{transformOrigin:'50% 82%'});
      tl.set(w.el,{autoAlpha:1},T+.06);
      tl.fromTo(w.inner,{y:-1200,scaleY:1.18,scaleX:.9},{y:0,scaleY:1.18,scaleX:.9,duration:.28,ease:'power3.in',immediateRender:false},T+.06);
      tl.to(w.inner,{scaleY:.74,scaleX:1.14,duration:.05,ease:'power2.out'},T+.34);
      tl.to(w.inner,{scaleY:1,scaleX:1,duration:.32,ease:'elastic.out(1,.45)'},T+.39);
      tl.to(w.inner,{y:1200,duration:.12,ease:'power3.in'},T+.73);
      const sh=mk('div','sline',w.el); sh.style.cssText+=`left:360px;width:1200px;top:${wb}px;height:6px;background:#fff`;
      gsap.set(sh,{autoAlpha:0});
      tl.fromTo(sh,{scaleX:.1,autoAlpha:1},{scaleX:1.1,autoAlpha:0,duration:.35,ease:'expo.out',immediateRender:false},T+.34);
      for(let k=0;k<6;k++) tl.to(content,{x:(k%2?1:-1)*(16-k*2.5),y:(k%2?-1:1)*(10-k*1.6),duration:.035,ease:'none'},T+.34+k*.035);
      tl.to(content,{x:0,y:0,duration:.05,ease:'none'},T+.34+6*.035);
    },
    elastico(w,T){
      const st=.14/Math.max(1,w.cs.length-1);
      gsap.set(w.cs,{autoAlpha:0});
      tl.set(w.el,{autoAlpha:1},T);
      tl.fromTo(w.cs,{autoAlpha:0},{autoAlpha:1,duration:.01,stagger:st,immediateRender:false},T+.04);
      tl.fromTo(w.cs,{scaleX:2.6,scaleY:.4},{scaleX:1,scaleY:1,duration:.55,ease:'elastic.out(1,.3)',stagger:st,immediateRender:false},T+.04);
      tl.fromTo(w.inner,{skewX:16},{skewX:0,duration:.7,ease:'elastic.out(1,.3)',immediateRender:false},T+.04);
      tl.to(w.cs,{scaleX:2.2,scaleY:.35,autoAlpha:0,duration:.12,ease:'power2.in'},T+.74);
    },
    leve(w,T){
      const st=.1/Math.max(1,w.cs.length-1);
      gsap.set(w.cs,{autoAlpha:0});
      tl.set(w.el,{autoAlpha:1},T);
      tl.fromTo(w.cs,{y:120,autoAlpha:0,rotation:()=>gsap.utils.random(-10,10)},{y:0,autoAlpha:1,rotation:0,duration:.4,ease:'sine.out',stagger:st,immediateRender:false},T+.03);
      tl.to(w.inner,{y:-40,duration:.5,ease:'sine.inOut'},T+.2);
      tl.to(w.cs,{y:-160,autoAlpha:0,duration:.2,ease:'sine.in',stagger:st/2},T+.56);
      [[260,0],[520,.05],[820,.1],[1100,.04],[1380,.09],[1640,.02]].forEach(([x,dl],k)=>{
        const b=mk('div','bub',w.el), s=22+((k*13)%26);
        b.style.cssText+=`left:${x}px;top:1100px;width:${s}px;height:${s}px`;
        tl.fromTo(b,{y:0,autoAlpha:.9},{y:-(900+k*40),autoAlpha:0,duration:.85,ease:'sine.out',immediateRender:false},T+dl);
      });
    }
  };

  words.forEach((w,i)=>{
    const T0=WT[i], col=i%2?'#fff':'#000', right=i%2===0, wb=w.wb;
    wipe(T0,WBG[i],WM[i],{d:.28});
    (FX[w.p.fx]||FX.rapido)(w,T0,wb);
    tl.set(w.el,{autoAlpha:0},T0+WD);
    note(w.p.nota, right?1240:330, wb+95, right?-3:3, col,
      right ? {sx:1300,sy:wb+90,ex:1180,ey:wb+30,b:-30} : {sx:430,sy:wb+90,ex:560,ey:wb+30,b:30}
    ).in(T0+.32,T0+WD-.04);
  });

  /* ================= CENA 4 · gráfico de easing ================= */
  const EA = gsap.parseEase('power3.inOut');
  const CX=200,CY=900,CW=720,CH=640,TX=1160,TW=600,TR1=450,TR2=740;
  const gC = sv('g',{},svg); gsap.set(gC,{autoAlpha:0});
  const gGrid = sv('g',{},gC); gsap.set(gGrid,{autoAlpha:0});
  [.25,.5,.75].forEach(f=>{
    sv('line',{x1:CX+CW*f,y1:CY-CH,x2:CX+CW*f,y2:CY,stroke:'#000','stroke-opacity':.13,'stroke-width':3},gGrid);
    sv('line',{x1:CX,y1:CY-CH*f,x2:CX+CW,y2:CY-CH*f,stroke:'#000','stroke-opacity':.13,'stroke-width':3},gGrid);
  });
  const pathAttrs = w => ({fill:'none',stroke:'#000','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1'});
  const axes = sv('path',Object.assign({d:`M${CX} ${CY-CH-20} V${CY} H${CX+CW+20}`},pathAttrs(10)),gC);
  const linP = sv('path',Object.assign({d:`M${CX} ${CY} L${CX+CW} ${CY-CH}`,'stroke-opacity':.38},pathAttrs(10)),gC);
  let dd=''; for(let i=0;i<=60;i++){ const u=i/60; dd+=(i?'L':'M')+(CX+CW*u).toFixed(1)+' '+(CY-CH*EA(u)).toFixed(1); }
  const easP = sv('path',Object.assign({d:dd},pathAttrs(15)),gC);
  gsap.set([axes,linP,easP],{strokeDashoffset:1});
  const trk1 = sv('line',{x1:TX,y1:TR1,x2:TX+TW,y2:TR1,stroke:'#000','stroke-opacity':.25,'stroke-width':5},gC);
  const trk2 = sv('line',{x1:TX,y1:TR2,x2:TX+TW,y2:TR2,stroke:'#000','stroke-opacity':.25,'stroke-width':5},gC);
  const bL = sv('rect',{x:TX-45,y:TR1-45,width:90,height:90,fill:'#000','fill-opacity':.38},gC);
  const bE = sv('rect',{x:TX-45,y:TR2-45,width:90,height:90,fill:'#000'},gC);
  const dL = sv('circle',{cx:CX,cy:CY,r:22,fill:'#000','fill-opacity':.45},gC);
  const dE = sv('circle',{cx:CX,cy:CY,r:27,fill:'#000'},gC);
  gsap.set([trk1,trk2,bL,bE,dL,dE],{autoAlpha:0});
  const labL = mk('div','big lab',content,'Linear'); labL.style.cssText+=`left:${TX}px;top:${TR1-170}px;opacity:1`;
  const labE = mk('div','big lab',content,'Ease in-out'); labE.style.cssText+=`left:${TX}px;top:${TR2-170}px`;
  gsap.set([labL,labE],{autoAlpha:0});

  wipe(S4,LIGHT,'l',{d:.3});
  tl.set(gC,{autoAlpha:1},S4+.15);
  tl.fromTo(axes,{strokeDashoffset:1},{strokeDashoffset:0,duration:.35,ease:'power2.out',immediateRender:false},S4+.15);
  tl.to(gGrid,{autoAlpha:1,duration:.2},S4+.3);
  tl.fromTo(linP,{strokeDashoffset:1},{strokeDashoffset:0,duration:.4,ease:'power2.inOut',immediateRender:false},S4+.4);
  tl.fromTo(easP,{strokeDashoffset:1},{strokeDashoffset:0,duration:.55,ease:'power2.inOut',immediateRender:false},S4+.7);
  tl.to([trk1,bL],{autoAlpha:1,duration:.15},S4+.45);
  tl.to([trk2,bE],{autoAlpha:1,duration:.15},S4+.8);
  tl.to([dL,dE],{autoAlpha:1,duration:.1},S4+1.1);
  tl.fromTo(labL,{autoAlpha:0,y:30},{autoAlpha:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},S4+.45);
  tl.fromTo(labE,{autoAlpha:0,y:30},{autoAlpha:1,y:0,duration:.25,ease:'power2.out',immediateRender:false},S4+.8);
  const cp={p:0};
  tl.to(cp,{p:1,duration:.95,ease:'none',onUpdate:()=>{
    const p=cp.p, e=EA(p);
    dL.setAttribute('cx',CX+CW*p); dL.setAttribute('cy',CY-CH*p);
    dE.setAttribute('cx',CX+CW*p); dE.setAttribute('cy',CY-CH*e);
    bL.setAttribute('x',TX-45+TW*p); bE.setAttribute('x',TX-45+TW*e);
  }},S4+1.15);
  tl.to([gC,labL,labE],{autoAlpha:0,duration:.1},S5-.12);

  note('linear = robótico',230,140,-3,'#000',{sx:340,sy:222,ex:414,ey:700,b:-60}).in(S4+1.0,S4+2.08);
  note('devagar · rápido · devagar',1130,860,-2,'#000',{sx:1190,sy:850,ex:1215,ey:798,b:-20},64).in(S4+1.35,S4+2.08);
  note('tempo',520,935,0,'#000',null,58).in(S4+.5,S4+2.08);
  note('valor',128,610,-90,'#000',null,58).in(S4+.5,S4+2.08);

  /* ================= CENA 5 · cobra de pontos (follow-through) ================= */
  /* trajeto com prefixo fora do ecrã; cada ponto da cobra persegue a sua posição
     no trajeto (cabeça - i*D) através de uma mola -> atraso + overshoot (follow-through) */
  const RAW=[[-1300,320],[-100,320],[850,320],[850,760],[1400,760],[1400,430]];
  const PTS=(()=>{ /* Chaikin: cantos arredondados */
    let a=RAW;
    for(let it=0;it<4;it++){
      const n=[a[0]];
      for(let i=0;i<a.length-1;i++){
        const p=a[i], q=a[i+1];
        n.push([.75*p[0]+.25*q[0],.75*p[1]+.25*q[1]],[.25*p[0]+.75*q[0],.25*p[1]+.75*q[1]]);
      }
      n.push(a[a.length-1]); a=n;
    }
    return a;
  })();
  const SEGL=[]; let PTOT=0;
  for(let i=0;i<PTS.length-1;i++){ const l=Math.hypot(PTS[i+1][0]-PTS[i][0],PTS[i+1][1]-PTS[i][1]); SEGL.push(l); PTOT+=l; }
  const PRE=1200, PL=PTOT-PRE, hp={s:0};
  function pathAt(s){
    s=Math.max(0,Math.min(PTOT,s));
    for(let i=0;i<SEGL.length;i++){
      if(s<=SEGL[i]||i===SEGL.length-1){
        const f=Math.min(1,s/SEGL[i]);
        return [PTS[i][0]+(PTS[i+1][0]-PTS[i][0])*f, PTS[i][1]+(PTS[i+1][1]-PTS[i][1])*f];
      }
      s-=SEGL[i];
    }
  }
  const N=17, D=48, K=520, C=24, P=[];
  let acc=0;
  function resetSnake(){
    P.length=0; acc=0;
    for(let i=0;i<N;i++){ const q=pathAt(PRE-i*D); P.push({x:q[0],y:q[1],vx:0,vy:0}); }
  }
  resetSnake();
  const ctx=cv.getContext('2d');
  function stepSnake(h){
    const hs=PRE+hp.s;
    for(let i=0;i<N;i++){
      const q=pathAt(hs-i*D), p=P[i];
      p.x=q[0]; p.y=q[1];
    }
  }
  function drawSnake(){
    ctx.clearRect(0,0,1920,1080);
    for(let j=0;j<17;j++) for(let k=0;k<9;k++){
      const x=80+110*j, y=100+110*k; let dm=1e9;
      for(let i=0;i<N;i+=2){ const d=Math.hypot(P[i].x-x,P[i].y-y); if(d<dm) dm=d; }
      const f=Math.pow(Math.max(0,1-dm/150),2);
      ctx.fillStyle=`rgba(255,255,255,${.26+.74*f})`;
      ctx.beginPath(); ctx.arc(x,y,5+6*f,0,6.2832); ctx.fill();
    }
    ctx.fillStyle='#fff';
    for(let i=N-1;i>=0;i--){ ctx.beginPath(); ctx.arc(P[i].x,P[i].y,34-i*(22/(N-1)),0,6.2832); ctx.fill(); }
  }
  wipe(S5,GRAPH,'u',{d:.3});
  tl.set(cv,{autoAlpha:1},S5+.2);
  tl.to(hp,{s:PL,duration:1.45,ease:'power1.inOut'},S5+.15);
  tl.to(cv,{autoAlpha:0,duration:.1},S6-.12);
  note('follow-through',1230,880,-3,'#fff',{sx:1350,sy:872,ex:1180,ey:800,b:-40}).in(S5+1.0,S6-.14);

  /* ================= CENA 6 · dial (anticipation) ================= */
  const DX=960,DY=520,DR=300,CIRC=2*Math.PI*DR;
  const gDisc = sv('g',{},svg);
  const disc = sv('circle',{cx:DX,cy:DY,r:270,fill:GRAPH},gDisc);
  gsap.set(disc,{svgOrigin:`${DX} ${DY}`,scale:0});
  const gR = sv('g',{},svg); gsap.set(gR,{svgOrigin:`${DX} ${DY}`,autoAlpha:0});
  sv('circle',{cx:DX,cy:DY,r:DR,fill:'none',stroke:'#000','stroke-opacity':.14,'stroke-width':34},gR);
  const prog = sv('circle',{cx:DX,cy:DY,r:DR,fill:'none',stroke:'#000','stroke-width':34,transform:`rotate(-90 ${DX} ${DY})`,'stroke-dasharray':CIRC},gR);
  prog.setAttribute('stroke-dashoffset',CIRC);
  const ticks=[...Array(48)].map((_,i)=>{
    const a=i/48*Math.PI*2-Math.PI/2, r1=345, r2=370;
    return sv('line',{x1:DX+Math.cos(a)*r1,y1:DY+Math.sin(a)*r1,x2:DX+Math.cos(a)*r2,y2:DY+Math.sin(a)*r2,stroke:'#000','stroke-width':5,'stroke-linecap':'round','stroke-opacity':.2},gR);
  });
  const num = mk('div','big',content,'0%');
  num.style.cssText+=`left:0;width:1920px;text-align:center;font-size:250px;height:250px;line-height:250px;top:${DY-125+8}px;color:#000`;
  gsap.set(num,{autoAlpha:0});
  const dv={v:0};
  const updDial=()=>{
    prog.setAttribute('stroke-dashoffset',CIRC*(1-dv.v/100));
    num.textContent=Math.round(dv.v)+'%';
    ticks.forEach((t,i)=>t.setAttribute('stroke-opacity',i<dv.v/100*48?1:.2));
  };
  wipe(S6,LIGHT,'r',{d:.3});
  tl.set([gR,num],{autoAlpha:1},S6+.12);
  tl.fromTo(gR,{scale:.7},{scale:1,duration:.3,ease:'back.out(2)',immediateRender:false},S6+.12);
  /* anticipation: o anel recua (escala + rotação contrária) enquanto o número fica em 0% */
  tl.to(gR,{scale:.9,rotation:-25,duration:.3,ease:'power2.inOut'},S6+.45);
  tl.to(num,{scale:.92,duration:.3,ease:'power2.inOut'},S6+.45);
  /* carga: contagem sempre a subir, de 0 a 100, sem recuos */
  tl.to(dv,{v:100,duration:.58,ease:'power2.inOut',snap:{v:1},onUpdate:updDial},S6+.8);
  tl.to(gR,{scale:1,rotation:0,duration:.35,ease:'power3.out'},S6+.8);
  tl.to(num,{scale:1,duration:.35,ease:'power3.out'},S6+.8);
  tl.to(gR,{scale:1.08,duration:.06,ease:'power2.out'},S6+1.38);
  tl.to(gR,{scale:1,duration:.16,ease:'power2.out'},S6+1.44);
  tl.fromTo(disc,{scale:0},{scale:1,duration:.2,ease:'expo.out',immediateRender:false},S6+1.38);
  tl.set(num,{color:'#fff'},S6+1.38);
  tl.fromTo(num,{scale:1},{scale:1.08,duration:.08,ease:'power2.out',immediateRender:false},S6+1.38);
  tl.to(num,{scale:1,duration:.14,ease:'power2.inOut'},S6+1.46);
  note('anticipation',1290,170,4,'#000',{sx:1380,sy:255,ex:1215,ey:318,b:-30}).in(S6+.4,S6+1.35);

  /* ================= CENA 7 · título ================= */
  wipe(S7,GRAPH,'c',{x:DX,y:DY,d:.55,ease:'power2.out',r0:270});
  tl.to(gR,{scale:4,autoAlpha:0,duration:.45,ease:'power2.out'},S7);
  tl.to(num,{autoAlpha:0,duration:.15},S7+.2);
  tl.set(gDisc,{autoAlpha:0},S7+.6);

  const l1=mk('div','big',content); l1.style.cssText+='left:160px;top:0;font-size:200px;color:#fff';
  const r1=mk('span','',l1); r1.style.display='inline-block';
  const c1=chars(r1,CFG.cargo+' /'); const b1=mk('i','bl',r1);
  const band=mk('div','',content); band.style.background='#fff';
  const l2=mk('div','big',content); l2.style.cssText+='left:160px;top:0;font-size:200px;color:#000';
  const r2=mk('span','',l2); r2.style.display='inline-block';
  const c2=chars(r2,CFG.nome); const dot2=mk('span','c',r2,'.'); dot2.style.color='transparent'; const b2=mk('i','bl',r2);
  let f7=200; const w1=pos(r1).w;
  if(w1>1560){ f7=Math.floor(200*1560/w1); l1.style.fontSize=f7+'px'; l2.style.fontSize=f7+'px'; }
  const B1=420, B2=B1+f7*1.12;
  l1.style.top=(B1-pos(b1).b)+'px';
  l2.style.top=(B2-pos(b2).b)+'px';
  const nr=pos(r2);
  band.style.cssText+=`left:${nr.l-34}px;width:${nr.w+68}px;top:${B2-f7*.88}px;height:${f7*1.05}px;transform-origin:0 50%`;
  const d2=pos(dot2), PX2=d2.l+d2.w/2, DS2=f7*.2;
  gsap.set([...c1,...c2],{autoAlpha:0}); gsap.set(band,{scaleX:0});

  tl.fromTo(c1,{y:140,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,ease:'power3.out',stagger:.018,immediateRender:false},S7+.3);
  tl.fromTo(band,{scaleX:0},{scaleX:1,duration:.38,ease:'expo.out',immediateRender:false},S7+.4);
  tl.fromTo(c2,{y:100,autoAlpha:0},{y:0,autoAlpha:1,duration:.35,ease:'power3.out',stagger:.03,immediateRender:false},S7+.55);

  const ball2=mk('div','ball',content); ball2.style.cssText+='width:64px;height:64px;background:#fff';
  gsap.set(ball2,{xPercent:-50,yPercent:-100,x:PX2,y:-120,autoAlpha:0});
  const D0=S7+.6, ds2=DS2/64;
  tl.set(ball2,{autoAlpha:1},D0-.01);
  tl.fromTo(ball2,{y:-120,scaleX:.8,scaleY:1.3},{y:B2,scaleX:.8,scaleY:1.3,duration:.36,ease:'power2.in',immediateRender:false},D0);
  let q=D0+.36;
  tl.to(ball2,{scaleX:1.5,scaleY:.5,backgroundColor:'#000',duration:.06,ease:'power1.out'},q); q+=.06;
  tl.to(ball2,{y:B2-140,duration:.17,ease:'power2.out'},q);
  tl.to(ball2,{scaleX:.85,scaleY:1.2,duration:.08,ease:'power1.out'},q);
  tl.to(ball2,{scaleX:1,scaleY:1,duration:.09,ease:'sine.inOut'},q+.08); q+=.17;
  tl.to(ball2,{y:B2,duration:.17,ease:'power2.in'},q);
  tl.to(ball2,{scaleX:.9,scaleY:1.15,duration:.17,ease:'power2.in'},q); q+=.17;
  tl.to(ball2,{scaleX:1.35,scaleY:.6,duration:.05,ease:'power1.out'},q);
  tl.to(ball2,{scaleX:ds2,scaleY:ds2,duration:.22,ease:'back.out(2.2)'},q+.05);

  const ctaY=B2+f7*.14+120;
  note(CFG.cta,nr.l+20,ctaY,-3,'#fff',{sx:nr.l+90,sy:ctaY-12,ex:nr.l+190,ey:B2+f7*.14+16,b:40},84).in(S7+1.0);

  /* fim exacto aos 15s */
  tl.to({},{duration:.01},14.99);

  /* ================= frame hooks (rasto da bola + cobra) ================= */
  let hist=[], gOn=true, prev5=0;
  tl.eventCallback('onUpdate',()=>{
    const t=tl.time();
    if(t<.03){ hist=[]; gOn=true; }
    if(t<=L3+.02){
      hist.push({x:gp(ball,'x'),y:gp(ball,'y'),sx:gp(ball,'scaleX'),sy:gp(ball,'scaleY')});
      if(hist.length>40) hist.shift();
      if(t>.08) ghosts.forEach((gh,j)=>{
        const h=hist[hist.length-1-(j+1)*2];
        if(h) gsap.set(gh,{x:h.x,y:h.y,scaleX:h.sx*(1-.03*j),scaleY:h.sy*(1-.03*j),autoAlpha:.34*(1-j/ghosts.length)});
      });
    } else if(gOn){ gsap.set(ghosts,{autoAlpha:0}); gOn=false; }

    const on = t>=S5+.18 && t<S6-.02;
    if(!on){ if(t<S5+.18) resetSnake(); prev5=t; return; }
    let dt=t-prev5; prev5=t; if(dt<=0||dt>.1) dt=0;
    stepSnake(0);
    drawSnake();
  });

  tl.play(0);
  stage.addEventListener('click',()=>tl.restart());
  addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); tl.paused(!tl.paused()); }
    if(e.key==='r'||e.key==='R') tl.restart();
  });
  window.__tl = tl;
}

fit(); addEventListener('resize',fit);
(async function(){
  try{
    await Promise.race([
      Promise.all([document.fonts.load('190px Anton'),document.fonts.load('700 78px Caveat')]),
      new Promise(r=>setTimeout(r,2000))
    ]);
  }catch(e){}
  build();
})();
</script>
