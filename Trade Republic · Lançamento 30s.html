const img=$('#lg1');

async function build(){
try{await img.decode()}catch(e){}
const LW=900,LH=LW*img.naturalHeight/img.naturalWidth;
gsap.set('.lg',{width:LW,left:(1920-LW)/2,top:540-LH/2});
const tl=gsap.timeline({paused:true});
const ECH=new Map();
const E=el=>{if(!ECH.has(el)){const cs=[1,2].map(()=>{const c=el.cloneNode(true);c.removeAttribute('id');c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));c.style.pointerEvents='none';el.parentNode.insertBefore(c,el);return c});
  gsap.set([el,...cs],{opacity:0});ECH.set(el,cs)}return ECH.get(el)};
const BL='blur(26px)';
function In(el,t,from,dur=.8,ease='expo.out'){const c=E(el);
  tl.fromTo(el,{...from,filter:BL,opacity:0},{x:0,y:0,scale:1,filter:'blur(0px)',opacity:1,duration:dur,ease},t);
  c.forEach((e,i)=>tl.fromTo(e,{...from,filter:BL,opacity:0},{x:0,y:0,scale:1,filter:'blur(0px)',opacity:.22-i*.08,duration:dur+.12*(i+1),ease},t+.06*(i+1)).to(e,{opacity:0,duration:.25},t+dur+.12*(i+1)))}
function Out(el,t,to,dur=.45){const c=E(el);
  tl.to(el,{...to,filter:BL,opacity:0,duration:dur,ease:'expo.in'},t);
  c.forEach((e,i)=>tl.set(e,{opacity:.2-i*.07,x:0,y:0,scale:1,filter:'blur(0px)'},t+.05*(i+1)).to(e,{...to,filter:BL,opacity:0,duration:dur,ease:'expo.in'},t+.05*(i+1)))}
/* headline palavra a palavra com eco em contorno */
function head(id,text,t,out){const h=$(id);h.innerHTML=text.split(' ').map(w=>`<span class="wm"><span class="wi">${w}</span></span> `).join('');
  const cs=[1,2].map(()=>{const c=h.cloneNode(true);c.removeAttribute('id');c.classList.add('eo');h.parentNode.insertBefore(c,h);return c});
  [h,...cs].forEach((e,i)=>{const w=e.querySelectorAll('.wi');
    tl.fromTo(w,{yPercent:118,opacity:0,filter:'blur(16px)'},{yPercent:0,opacity:1,filter:'blur(0px)',duration:.75,ease:'expo.out',stagger:.09},t+i*.06);
    if(i)tl.to(e,{opacity:0,duration:.3},t+1.1+i*.05);
    if(out!=null){if(i)tl.set(e,{opacity:.45},out+i*.05);tl.to(w,{yPercent:-118,opacity:0,filter:'blur(16px)',duration:.4,ease:'expo.in',stagger:.04},out+i*.05)}})}
const dr=sel=>{const p=$(sel),L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});return p};
const cnt=(sel,to,t,d,pre='€')=>{const o={v:0};tl.to(o,{v:to,duration:d,ease:'expo.out',onUpdate(){$(sel).textContent=pre+Math.round(o.v).toLocaleString('pt-PT')}},t)};

/* 0 · abertura com o logo */
const lc=E($('#lg1'));
[$('#lg1'),...lc].forEach((e,i)=>{tl.fromTo(e,{clipPath:'inset(0 100% 0 0)',opacity:i?.25-i*.08:1},{clipPath:'inset(0 0% 0 0)',duration:.9,ease:'expo.inOut'},.3+i*.07);if(i)tl.to(e,{opacity:0,duration:.3},1.5+i*.05)});
Out($('#lg1'),2.5,{scale:1.3},.55);

/* 1 · FRASE 1 — portfólio */
let t=3.0;
head('#h1',CFG.f1,t+.1,t+4);In($('#ph'),t+.3,{x:260,y:80,scale:.95});
const c1=dr('#c1');tl.to(c1,{strokeDashoffset:0,duration:1.2,ease:'power2.inOut'},t+.9);cnt('#v1',12480,t+.9,1.6);

Out($('#ph'),t+4,{x:-200,y:-120,scale:1.05});

head('#h2',CFG.f2,t+.1,t+4);
['#d1','#d2','#d3','#d4'].forEach((id,i)=>{In($(id),t+.3+i*.12,{x:600});
  const p=dr(id+' .sp');tl.to(p,{strokeDashoffset:0,duration:.8,ease:'power2.inOut'},t+.8+i*.12);Out($(id),t+4+i*.05,{x:-500,y:-60})});
/* 3 · FRASE 3 — poupança automática */
t=12.0;
head('#h3',CFG.f3,t+.1,t+4);In($('#sv'),t+.3,{y:200,scale:.94});
tl.to('#sw u',{x:50,backgroundColor:'#fff',duration:.35,ease:'back.out(2)'},t+1).to('#sw',{borderColor:'#fff',duration:.35},t+1)
  .fromTo('.dots s',{backgroundColor:'rgba(255,255,255,0)'},{backgroundColor:'#fff',borderColor:'#fff',duration:.2,stagger:.12,ease:'none'},t+1.4);
Out($('#sv'),t+4,{y:-200,scale:1.05});

t=16.5;
head('#h4',CFG.f4,t+.1,t+4);
const pts=[.1,.14,.12,.2,.18,.26,.24,.3,.28,.38,.34,.42,.4,.5,.46,.58,.55,.64,.6,.72,.7,.8,.86,.94];
